[project]
name = "adk-00-hello-trench"
version = "0.1.0"
description = "Google ADK lore agent for the Twenty One Pilots narrative universe, with a behavioral eval suite"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2.10.0,<3",
    "pydantic-settings>=2.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adk_00_hello_trench"]

[dependency-groups]
eval = [
    "google-adk[eval]>=2.10.0,<3",
]
dev = [
    "pip-audit>=2.10.0",
    "pre-commit>=4.0.0",
    "pytest>=8.4.0",
    "ruff>=0.15.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "C4",   # flake8-comprehensions
    "RET",  # flake8-return
    "TID",  # flake8-tidy-imports
]

[tool.ruff.lint.per-file-ignores]
"src/adk_00_hello_trench/prompts.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
